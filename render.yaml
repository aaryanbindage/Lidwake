# Render Blueprint for the LidWake relay (relay/server.js) and its account database.
# Render dashboard → New → Blueprint → pick this repo, or use the button in README.md.
databases:
  - name: lidwake-db
    plan: free
    ipAllowList: []          # reachable only from Render services, not the internet

services:
  - type: web
    name: lidwake-relay
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lidwake-db
          property: connectionString
      - key: AUTH_PEPPER       # keeps the "does this account exist?" answer hidden
        generateValue: true
