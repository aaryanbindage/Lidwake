# Render Blueprint for the LidWake relay (relay/server.js).
# Render dashboard → New → Blueprint → pick this repo, or use the button in README.md.
# Accounts need a Postgres database: Render asks for DATABASE_URL when you create the
# Blueprint. Use e.g. Supabase's session pooler connection string; leave it empty to
# run the relay without accounts.
services:
  - type: web
    name: lidwake-relay
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: AUTH_PEPPER       # keeps the "does this account exist?" answer hidden
        generateValue: true
